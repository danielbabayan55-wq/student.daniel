<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square{
            width: 100px;
            height: 100px;
            background-color: rgb(18, 86, 6);
            margin-left: 0;
            animation-name: run;
            animation-duration: 5s;
            animation-iteration-count: 3;
        }
        .square-2{
            width: 100px;
            height: 100px;
            background-color: rgb(18, 86, 6);
            margin-left: 0;
            animation-name: shake;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes run {
            0%{
                margin-left: 0;
            }
            30%{
                margin-left: 600px;
            }
            50%{
                margin-left: 610px;
            }
            100%{margin-left: 0;}
        }
        @keyframes shake {
            0%{
                transform: rotate(0);
                margin-top: 0;
                margin-left: 0;
            }
            33%{
                transform: rotate(45deg);
                margin-top: 40px;
                margin-left: 46px;
            }
            66%{
                transform: rotate(-45deg);
                margin-top: 190px;
                margin-left: 250px;
            }
            100%{
                transform: rotate(0);
                margin-top: 0;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="square"></div>
    <div class="square-2"></div>
</body>
</html>
